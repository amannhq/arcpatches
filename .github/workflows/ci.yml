# Builds and tests on every push and pull request. Uses only this repository's
# code: no copy of Dia is downloaded or built here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        run: ./tests/run.sh
      - name: Build ArcPatches.app
        run: ./companion/build.sh --no-install
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArcPatches-${{ github.sha }}
          path: build/ArcPatches.app
          retention-days: 7
