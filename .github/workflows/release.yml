# Publishes a release when a version tag is pushed (git tag v1.2.3 && git push --tags).
#
# The release contains only ArcPatches.app (this repo's companion + the arcpatches
# patch). Nothing of Dia's is downloaded, built or shipped: each user's ArcPatches
# builds Dia Arc from their own installed Dia.
#
# Secrets:
#   ARCPATCHES_UPDATE_PRIVATE_KEY   required. Signs ArcPatches.zip for the in-app updater
#                              (scripts/make-update-key.sh creates it).
#   Optional, for a Developer ID signed + notarized app (no Gatekeeper warning):
#   APPLE_CERTIFICATE_P12      base64 of a "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID   for notarytool
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_DEVELOPER_ID: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag matches VERSION
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "Tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }
          grep -qx "## $(cat VERSION)" CHANGELOG.md || { echo "CHANGELOG.md has no section for $(cat VERSION)"; exit 1; }

      - name: Tests
        run: ./tests/run.sh

      - name: Build ArcPatches.app
        run: ./installer/build.sh --no-install

      - name: Sign with Developer ID and notarize
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="Developer ID Application"
          codesign -f -s "$IDENTITY" --options runtime --timestamp build/ArcPatches.app/Contents/Resources/arcpatches.dylib
          codesign -f -s "$IDENTITY" --options runtime --timestamp build/ArcPatches.app
          ditto -c -k --keepParent build/ArcPatches.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple build/ArcPatches.app

      - name: Package and sign the update
        env:
          ARCPATCHES_UPDATE_PRIVATE_KEY: ${{ secrets.ARCPATCHES_UPDATE_PRIVATE_KEY }}
        run: |
          test -n "$ARCPATCHES_UPDATE_PRIVATE_KEY" || { echo "ARCPATCHES_UPDATE_PRIVATE_KEY secret is not set"; exit 1; }
          test -s installer/update-public-key.txt || { echo "installer/update-public-key.txt is missing"; exit 1; }
          ditto -c -k --keepParent build/ArcPatches.app ArcPatches.zip
          swift tools/update-key.swift sign ArcPatches.zip > ArcPatches.zip.sig
          swift tools/update-key.swift verify ArcPatches.zip ArcPatches.zip.sig "$(cat installer/update-public-key.txt)"
          shasum -a 256 ArcPatches.zip > ArcPatches.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          CHANGES="$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed '/./,$!d')"
          test -n "$CHANGES" || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          INSTALL="**Install:** unzip, move ArcPatches.app to Applications, open it."
          if [ "$HAS_DEVELOPER_ID" != "true" ]; then
            INSTALL="$INSTALL This build isn't notarized: the first time, right-click ArcPatches.app → Open."
          fi
          NOTES="$(printf '%s\n\n%s' "$CHANGES" "$INSTALL")"
          gh release create "$GITHUB_REF_NAME" ArcPatches.zip ArcPatches.zip.sig ArcPatches.zip.sha256 \
            --title "ArcPatches ${GITHUB_REF_NAME#v}" --notes "$NOTES" --generate-notes
